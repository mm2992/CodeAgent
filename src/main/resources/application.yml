spring:
  application:
    name: ai-agent
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ******
    url: jdbc:mysql://localhost:3306/aiAgent
#  datasource:
#    url: url
#    username: my_user
#    password: *******
  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        max-document-batch-size: 10000

    mcp:
      client:
#        stdio: #使用本地调用方式连接图片搜索mcp
#          servers-configuration: classpath:mcp-servers.json
#临时注释掉方便部署
#        sse: #使用sse方式连接图片搜索mcp
#          connections:
#            server1:
#              url: http://localhost:8888
server:
  port: 8848
  servlet:
    context-path: /api
